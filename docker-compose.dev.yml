version: "3.9"
# Development overrides — hot reload, exposed ports, no build optimization

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps   # skip runtime optimizations
    volumes:
      - ./backend:/app
      - ssi_data:/app/data
    environment:
      DATABASE_URL: postgresql+asyncpg://ssi:${POSTGRES_PASSWORD:-ssi_secret_change_me}@postgres:5432/ssi_db
      DATABASE_URL_SYNC: postgresql://ssi:${POSTGRES_PASSWORD:-ssi_secret_change_me}@postgres:5432/ssi_db
      DEBUG: "true"
      ENVIRONMENT: development
      BROWSER_HEADLESS: "false"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ssi_net

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    networks:
      - ssi_net

volumes:
  ssi_data:

networks:
  ssi_net:
